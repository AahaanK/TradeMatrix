version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tradematrix-db
    environment:
      POSTGRES_USER: tradematrix
      POSTGRES_PASSWORD: tradematrix_secure_pass
      POSTGRES_DB: tradematrix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradematrix -d tradematrix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradematrix-backend
    environment:
      DATABASE_URL: postgresql://tradematrix:tradematrix_secure_pass@db:5432/tradematrix
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_cache:/app/.cache/tradematrix/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradematrix-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_cache:
